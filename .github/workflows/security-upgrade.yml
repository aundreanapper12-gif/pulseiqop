name: Upgrade Next.js Security Patch

on:
  push:
    branches:
      - feat/pulseiq-business-platform
    paths:
      - .github/workflows/security-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pulseiq-business-platform

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade patched Next.js release
        run: npm install --save-exact next@16.3.3 eslint-config-next@16.3.3

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit package updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes to commit."
          else
            git commit -m "chore: upgrade Next.js to patched 16.3.3"
            git push origin HEAD:feat/pulseiq-business-platform
          fi
